services:
    db:
        image: postgres
        restart: always
        ports: 
            - "5433:5432"
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        volumes:
            - pgdata:/var/lib/postgresql
            - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
            
volumes:
    pgdata: